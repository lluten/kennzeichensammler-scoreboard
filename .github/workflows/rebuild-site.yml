name: Rebuild scoreboard

on:
  push:
    paths:
      - "backups/**"
      - "scripts/generate_site.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate site data
        run: python3 scripts/generate_site.py --input-root backups

      - name: Commit generated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data profiles index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Rebuild scoreboard from latest backups"
          git push
